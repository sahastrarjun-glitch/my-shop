name: Unzip and Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and prepare workspace
        run: |
          unzip -q -o *.zip
          # Gradle wrapper ko dhund kar root me set karna
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Moving files from $PROJECT_DIR to root..."
            cp -r $PROJECT_DIR/* . 2>/dev/null || true
            chmod +x gradlew
          else
            echo "gradlew not found!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-shop-apk
          path: "**/build/outputs/apk/debug/*.apk"
          

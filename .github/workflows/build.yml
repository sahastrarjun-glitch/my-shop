name: Unzip and Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and prepare workspace
        run: |
          unzip -q -o *.zip
          # Agar zip kisi folder ke andar khuli ho to files bahar lana
          BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            DIR=$(dirname "$BUILD_FILE")
            if [ "$DIR" != "." ]; then
              cp -r $DIR/* . 2>/dev/null || true
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-shop-apk
          path: "**/build/outputs/apk/debug/*.apk"
          

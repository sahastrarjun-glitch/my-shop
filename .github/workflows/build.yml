name: Build MY SHOP APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and move files
        run: |
          unzip -q -o *.zip
          BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            DIR=$(dirname "$BUILD_FILE")
            if [ "$DIR" != "." ]; then
              cp -r $DIR/* . 2>/dev/null || true
            fi
          fi

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          PKG_NAME=$(grep -r "applicationId" app/ 2>/dev/null | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME=$(grep -r "namespace" app/ 2>/dev/null | head -n 1 | awk -F'"' '{print $2}')
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.example.myshop"
          fi
          cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "dummy-app",
              "storage_bucket": "dummy-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:dummy",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "api_key": [{ "current_key": "dummy_key" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-shop-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
